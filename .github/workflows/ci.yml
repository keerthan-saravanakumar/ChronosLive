name: Verify ChronosLive
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm test --workspace client
      - uses: actions/cache@v4
        with:
          path: .cache/mongodb
          key: mongodb-${{ runner.os }}-7.0.24
      - run: npm test
      - run: npm run build
